apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
  namespace: default
  labels:
    app: django
    version: "1.0"
    component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
        version: "1.0"
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: django-service-account
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: django
          image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/tuwi-backend:{{IMAGE_TAG}}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            # Database Configuration (Neon PostgreSQL)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: django-secrets
                  key: DATABASE_URL
            - name: DATABASE_SSL_REQUIRE
              value: "true"
            
            # Django Configuration
            - name: DJANGO_SETTINGS_MODULE
              value: "core.settings"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: django-secrets
                  key: SECRET_KEY
            - name: DEBUG
              valueFrom:
                secretKeyRef:
                  name: django-secrets
                  key: DEBUG
            - name: ALLOWED_HOSTS
              valueFrom:
                secretKeyRef:
                  name: django-secrets
                  key: ALLOWED_HOSTS
            
            # Application Configuration
            - name: DJANGO_LOG_LEVEL
              value: "INFO"
            - name: GUNICORN_WORKERS
              value: "3"
            - name: GUNICORN_TIMEOUT
              value: "30"
            
            # Health Check Configuration
            - name: HEALTH_CHECK_URL
              value: "/api/health/"
            
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          
          # Health Checks
          readinessProbe:
            httpGet:
              path: /api/health/
              port: http
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          
          livenessProbe:
            httpGet:
              path: /api/health/
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          
          # Startup Probe (para aplicações que demoram a inicializar)
          startupProbe:
            httpGet:
              path: /api/health/
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 30
          
          # Security Context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          
          # Volume Mounts
          volumeMounts:
            - name: temp-storage
              mountPath: /tmp
            - name: static-files
              mountPath: /app/staticfiles
      
      # Volumes
      volumes:
        - name: temp-storage
          emptyDir: {}
        - name: static-files
          emptyDir: {}
      
      # Pod Disruption Budget
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: django-svc
spec:
  type: ClusterIP
  selector:
    app: django
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: django-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: django
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
