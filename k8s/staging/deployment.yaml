# =============================================================================
# STAGING DEPLOYMENT - DJANGO APPLICATION
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-staging
  namespace: staging
  labels:
    app: django
    version: "1.0"
    component: backend
    environment: staging
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: django
      environment: staging
  template:
    metadata:
      labels:
        app: django
        version: "1.0"
        component: backend
        environment: staging
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: django-service-account
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: django
          image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/tuwi-backend:staging-{{IMAGE_TAG}}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            # Database Configuration (Neon PostgreSQL - Staging)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: django-secrets-staging
                  key: DATABASE_URL
            - name: DATABASE_SSL_REQUIRE
              value: "true"
            
            # Django Configuration - Staging
            - name: DJANGO_SETTINGS_MODULE
              value: "core.settings"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: django-secrets-staging
                  key: SECRET_KEY
            - name: DEBUG
              value: "True"  # Ativado para staging
            - name: ALLOWED_HOSTS
              value: "*"
            
            # Environment Identification
            - name: ENVIRONMENT
              value: "staging"
            - name: DJANGO_LOG_LEVEL
              value: "DEBUG"
            
            # Staging Features
            - name: ENABLE_DEBUG_TOOLBAR
              value: "True"
            - name: ENABLE_SILK_PROFILING
              value: "True"
            
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          
          # Health Checks (mais tolerantes para staging)
          readinessProbe:
            httpGet:
              path: /api/health/
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
          
          livenessProbe:
            httpGet:
              path: /api/health/
              port: http
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 5
          
          # Security Context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          
          # Volume Mounts
          volumeMounts:
            - name: temp-storage
              mountPath: /tmp
            - name: static-files
              mountPath: /app/staticfiles
      
      # Volumes
      volumes:
        - name: temp-storage
          emptyDir: {}
        - name: static-files
          emptyDir: {}

---
# =============================================================================
# STAGING SERVICE
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: django-svc-staging
  namespace: staging
  labels:
    app: django
    component: backend
    environment: staging
spec:
  type: ClusterIP
  selector:
    app: django
    environment: staging
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

---
# =============================================================================
# STAGING HORIZONTAL POD AUTOSCALER
# =============================================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: django-hpa-staging
  namespace: staging
  labels:
    app: django
    component: backend
    environment: staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: django-staging
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# =============================================================================
# STAGING POD DISRUPTION BUDGET
# =============================================================================

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: django-pdb-staging
  namespace: staging
  labels:
    app: django
    component: backend
    environment: staging
spec:
  minAvailable: 0  # Mais flexível para staging
  selector:
    matchLabels:
      app: django
      environment: staging