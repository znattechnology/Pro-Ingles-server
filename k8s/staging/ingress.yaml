# =============================================================================
# STAGING INGRESS - AWS ALB
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: django-ingress-staging
  namespace: staging
  labels:
    app: django
    component: backend
    environment: staging
  annotations:
    # AWS Load Balancer Controller
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: tuwi-staging-alb
    
    # Health checks
    alb.ingress.kubernetes.io/healthcheck-path: /api/health/
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
    
    # Tags
    alb.ingress.kubernetes.io/tags: Environment=staging,Project=tuwi-backend,ManagedBy=k8s
    
    # Security
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    
    # Performance
    alb.ingress.kubernetes.io/target-group-attributes: |
      stickiness.enabled=false,
      deregistration_delay.timeout_seconds=30,
      slow_start.duration_seconds=0
    
    # Certificate (comentado - adicionar quando tiver certificado)
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-west-1:ACCOUNT:certificate/CERT-ID
    
spec:
  rules:
    - host: staging-api.tuwi.com  # Substitua pelo seu domínio
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: django-svc-staging
                port:
                  number: 80
          
          # API específicas
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: django-svc-staging
                port:
                  number: 80
          
          # Admin Django
          - path: /admin/
            pathType: Prefix
            backend:
              service:
                name: django-svc-staging
                port:
                  number: 80
          
          # Static files (se servidos pelo Django)
          - path: /static/
            pathType: Prefix
            backend:
              service:
                name: django-svc-staging
                port:
                  number: 80
    
    # Fallback para qualquer host (temporário para testes)
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: django-svc-staging
                port:
                  number: 80

---
# =============================================================================
# STAGING INGRESS - INTERNAL (para testes internos)
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: django-ingress-staging-internal
  namespace: staging
  labels:
    app: django
    component: backend
    environment: staging
    access: internal
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: tuwi-staging-internal-alb
    alb.ingress.kubernetes.io/healthcheck-path: /api/health/
    alb.ingress.kubernetes.io/tags: Environment=staging,Project=tuwi-backend,Access=internal
    
spec:
  rules:
    - host: staging-internal.tuwi.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: django-svc-staging
                port:
                  number: 80