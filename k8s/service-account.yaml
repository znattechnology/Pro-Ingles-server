# =============================================================================
# SERVICE ACCOUNT - DJANGO APPLICATION
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: django-service-account
  namespace: default
  labels:
    app: django
    component: backend
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/tuwi-production-django-role

---
# =============================================================================
# CLUSTER ROLE - BASIC PERMISSIONS
# =============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: django-cluster-role
  labels:
    app: django
    component: backend
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]

---
# =============================================================================
# CLUSTER ROLE BINDING
# =============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: django-cluster-role-binding
  labels:
    app: django
    component: backend
subjects:
  - kind: ServiceAccount
    name: django-service-account
    namespace: default
roleRef:
  kind: ClusterRole
  name: django-cluster-role
  apiGroup: rbac.authorization.k8s.io

---
# =============================================================================
# POD DISRUPTION BUDGET
# =============================================================================

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: django-pdb
  namespace: default
  labels:
    app: django
    component: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: django