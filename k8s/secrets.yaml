# =============================================================================
# KUBERNETES SECRETS - DJANGO APPLICATION
# =============================================================================
# IMPORTANTE: Este arquivo contém placeholders que devem ser substituídos
# durante o processo de deploy via GitHub Actions ou manualmente
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: django-secrets
  namespace: default
  labels:
    app: django
    component: backend
type: Opaque
stringData:
  # PostgreSQL Neon Database URL
  # Formato: postgresql://username:password@hostname:port/database?sslmode=require
  DATABASE_URL: "postgresql://neondb_owner:password@ep-divine-dew-agc1ldk8-pooler.c-2.eu-central-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
  
  # Django Secret Key (deve ser gerado com: python manage.py generate_secret_key)
  SECRET_KEY: "__DJANGO_SECRET_KEY_PLACEHOLDER__"
  
  # Django Debug Mode (False para produção)
  DEBUG: "False"
  
  # Allowed Hosts (domínios permitidos)
  ALLOWED_HOSTS: "*"

---
# =============================================================================
# CONFIGMAP - APPLICATION CONFIGURATION
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: django-config
  namespace: default
  labels:
    app: django
    component: backend
data:
  # Django Settings
  DJANGO_SETTINGS_MODULE: "core.settings"
  DJANGO_LOG_LEVEL: "INFO"
  
  # Database Settings
  DATABASE_SSL_REQUIRE: "true"
  DATABASE_CONN_MAX_AGE: "0"
  
  # Gunicorn Configuration
  GUNICORN_WORKERS: "3"
  GUNICORN_TIMEOUT: "30"
  GUNICORN_KEEPALIVE: "2"
  
  # Application Settings
  HEALTH_CHECK_URL: "/api/health/"
  STATIC_ROOT: "/app/staticfiles"
  MEDIA_ROOT: "/app/media"
  
  # Security Settings
  SECURE_SSL_REDIRECT: "true"
  SECURE_HSTS_SECONDS: "31536000"
  SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
  SECURE_HSTS_PRELOAD: "true"
  
  # CORS Settings
  CORS_ALLOWED_ORIGINS: "https://proenglish.com,https://www.proenglish.com"
  CORS_ALLOW_CREDENTIALS: "true"

---
# =============================================================================
# TLS SECRET - SSL CERTIFICATE (se necessário)
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: tls-secret
  namespace: default
  labels:
    app: django
    component: backend
type: kubernetes.io/tls
data:
  # Certificado TLS base64 encoded
  tls.crt: __TLS_CERT_BASE64__
  # Chave privada TLS base64 encoded  
  tls.key: __TLS_KEY_BASE64__