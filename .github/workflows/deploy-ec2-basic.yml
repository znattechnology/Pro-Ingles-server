# =============================================================================
# DEPLOY TO EC2 BASIC - PROENGLISH PLATFORM
# Deploy workflow for our economic AWS infrastructure ($40/month budget)
# =============================================================================

name: Deploy to EC2 Basic

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/main' }}
    environment: production
    
    env:
      AWS_REGION: eu-west-1
      EC2_HOST: 34.245.99.169
      EC2_USER: ec2-user
      APP_DIR: /opt/proenglish
      SERVICE_NAME: proenglish

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Check EC2 instance status
        run: |
          aws ec2 describe-instances \
            --instance-ids i-0a950276bc299a5b7 \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text

      - name: Backup current application (if exists)
        run: |
          ssh -i ~/.ssh/id_rsa ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "
            if [ -d '${{ env.APP_DIR }}' ] && [ \$(ls -A ${{ env.APP_DIR }}) ]; then
              echo '📦 Creating backup of current application...'
              sudo tar -czf /opt/pro-english/backups/app_backup_\$(date +%Y%m%d_%H%M%S).tar.gz -C ${{ env.APP_DIR }} . || true
              echo '✅ Backup created'
            else
              echo '📁 No existing application to backup'
            fi
          "

      - name: Deploy application code
        run: |
          echo "🚀 Deploying application to EC2..."
          
          # Create deployment package
          tar --exclude='.git' \
              --exclude='terraform' \
              --exclude='venv' \
              --exclude='__pycache__' \
              --exclude='*.pyc' \
              --exclude='.pytest_cache' \
              --exclude='node_modules' \
              --exclude='.terraform' \
              -czf deploy-package.tar.gz .
          
          # Upload to server
          scp -i ~/.ssh/id_rsa deploy-package.tar.gz ${{ env.EC2_USER }}@${{ env.EC2_HOST }}:/tmp/
          
          # Extract and setup on server
          ssh -i ~/.ssh/id_rsa ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "
            echo '📤 Extracting application code...'
            sudo rm -rf ${{ env.APP_DIR }}/*
            sudo tar -xzf /tmp/deploy-package.tar.gz -C ${{ env.APP_DIR }}
            sudo chown -R ec2-user:ec2-user ${{ env.APP_DIR }}
            rm /tmp/deploy-package.tar.gz
            echo '✅ Application code deployed'
          "

      - name: Install dependencies and setup
        run: |
          ssh -i ~/.ssh/id_rsa ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "
            cd ${{ env.APP_DIR }}
            
            echo '📦 Installing Python dependencies...'
            # Install Python 3.11 for better Django support
            sudo amazon-linux-extras install python3.8 -y || true
            python3 -m pip install --user --upgrade pip
            python3 -m pip install --user -r requirements.txt
            
            echo '🔧 Running Django setup...'
            # Load environment variables
            source /opt/pro-english/.env
            
            # Run Django commands
            python3 manage.py collectstatic --noinput
            python3 manage.py migrate --noinput
            
            echo '✅ Dependencies installed and Django setup complete'
          "

      - name: Start/Restart Django service
        run: |
          ssh -i ~/.ssh/id_rsa ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "
            echo '🚀 Starting Django application...'
            
            # Stop any existing Django processes
            pkill -f 'python3 manage.py runserver' || true
            sleep 2
            
            # Start Django in background
            cd ${{ env.APP_DIR }}
            source /opt/pro-english/.env
            nohup python3 manage.py runserver 0.0.0.0:8000 > /opt/pro-english/logs/django.log 2>&1 &
            
            # Give it time to start
            sleep 5
            
            # Check if it started successfully
            if pgrep -f 'python3 manage.py runserver' > /dev/null; then
              echo '✅ Django application started successfully'
            else
              echo '❌ Failed to start Django application'
              exit 1
            fi
          "

      - name: Health check
        run: |
          echo "🔍 Performing health check..."
          
          # Wait a bit more for the application to fully start
          sleep 10
          
          # Test the application endpoint
          for i in {1..5}; do
            if curl -f -s http://${{ env.EC2_HOST }}:8000/api/health/ > /dev/null; then
              echo "✅ Health check passed on attempt $i"
              break
            else
              echo "⏳ Health check failed on attempt $i, retrying in 10s..."
              sleep 10
              if [ $i -eq 5 ]; then
                echo "❌ Health check failed after 5 attempts"
                exit 1
              fi
            fi
          done

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/id_rsa ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "
            echo '🔍 Verifying deployment...'
            
            # Check Django process
            if pgrep -f 'python3 manage.py runserver' > /dev/null; then
              echo '✅ Django process is running'
            else
              echo '❌ Django process not found'
              exit 1
            fi
            
            # Check logs for any errors
            echo '📝 Recent application logs:'
            tail -10 /opt/pro-english/logs/django.log || echo 'No logs yet'
            
            # System resource check
            echo '💾 System resources:'
            free -h
            df -h /
            
            echo '🎉 Deployment verification complete!'
          "

      - name: Clean up
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa
          rm -f deploy-package.tar.gz

      - name: Post deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Infrastructure Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Instance:** i-0a950276bc299a5b7 (t3.small)" >> $GITHUB_STEP_SUMMARY
          echo "- **Public IP:** ${{ env.EC2_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Cost:** ~$20/month (within $40 budget)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Application URLs" >> $GITHUB_STEP_SUMMARY
          echo "- **API:** http://${{ env.EC2_HOST }}:8000/api/" >> $GITHUB_STEP_SUMMARY
          echo "- **Admin:** http://${{ env.EC2_HOST }}:8000/admin/" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Check:** http://${{ env.EC2_HOST }}:8000/api/health/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Application deployed successfully" >> $GITHUB_STEP_SUMMARY
          echo "- 🔗 Frontend can now connect to the API" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Monitor costs via AWS Cost Explorer" >> $GITHUB_STEP_SUMMARY

      - name: Notify deployment status
        if: failure()
        run: |
          echo "❌ Deployment failed. Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          echo "🔧 Troubleshooting steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Check EC2 instance status" >> $GITHUB_STEP_SUMMARY
          echo "2. Verify SSH connectivity" >> $GITHUB_STEP_SUMMARY
          echo "3. Check application logs on the server" >> $GITHUB_STEP_SUMMARY