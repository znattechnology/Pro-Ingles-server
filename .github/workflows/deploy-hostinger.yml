name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild containers'
        required: false
        default: false
        type: boolean

env:
  VPS_HOST: 72.61.190.180
  VPS_USER: root
  PROJECT_PATH: /opt/tuwi-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: GH_TOKEN
          script_stop: true
          script: |
            set -e

            echo "=========================================="
            echo "    TUWI BACKEND - DEPLOY HOSTINGER"
            echo "=========================================="

            # Setup git repository
            mkdir -p ${{ env.PROJECT_PATH }}
            cd ${{ env.PROJECT_PATH }}

            if [ ! -d ".git" ]; then
              echo "First deploy - initializing repository..."
              git init
              git remote add origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
            else
              echo "Updating repository..."
              git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
            fi

            git fetch origin
            git reset --hard origin/main

            # Create SSL directory and self-signed cert if not exists
            if [ ! -f "${{ env.PROJECT_PATH }}/nginx/ssl/fullchain.pem" ]; then
              echo "Creating SSL certificates..."
              mkdir -p ${{ env.PROJECT_PATH }}/nginx/ssl
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                -keyout ${{ env.PROJECT_PATH }}/nginx/ssl/privkey.pem \
                -out ${{ env.PROJECT_PATH }}/nginx/ssl/fullchain.pem \
                -subj '/CN=${{ env.VPS_HOST }}/O=TuwiBackend/C=PT'
            fi

            # Create certbot directories
            mkdir -p ${{ env.PROJECT_PATH }}/nginx/certbot/conf
            mkdir -p ${{ env.PROJECT_PATH }}/nginx/certbot/www

            # Check if .env exists, if not copy from production template
            if [ ! -f "${{ env.PROJECT_PATH }}/.env" ]; then
              echo "ERROR: .env file not found!"
              echo "Please create .env file on the server with production values"
              exit 1
            fi

            # Docker operations
            cd ${{ env.PROJECT_PATH }}

            echo "Stopping existing containers..."
            docker compose -f docker-compose.prod.yml down --remove-orphans || true

            echo "Building and starting containers..."
            if [ "${{ github.event.inputs.force_rebuild }}" = "true" ]; then
              docker compose -f docker-compose.prod.yml build --no-cache
            else
              docker compose -f docker-compose.prod.yml build
            fi

            docker compose -f docker-compose.prod.yml up -d

            echo "Waiting for services to start..."
            sleep 20

            echo "Running database migrations..."
            docker compose -f docker-compose.prod.yml exec -T backend python manage.py migrate --noinput

            echo "Collecting static files..."
            docker compose -f docker-compose.prod.yml exec -T backend python manage.py collectstatic --noinput

            echo "Checking container status..."
            docker compose -f docker-compose.prod.yml ps

            echo "Health check..."
            curl -sf http://localhost:8000/api/health/ && echo "Backend OK" || echo "Backend health check failed"

            echo "=========================================="
            echo "    DEPLOY COMPLETED SUCCESSFULLY!"
            echo "=========================================="