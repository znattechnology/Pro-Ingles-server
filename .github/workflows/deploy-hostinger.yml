name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild containers'
        required: false
        default: false
        type: boolean

env:
  VPS_HOST: 72.61.190.180
  VPS_USER: root
  PROJECT_PATH: /opt/tuwi-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: GH_TOKEN
          script_stop: true
          timeout: 300s
          command_timeout: 30m
          debug: true
          script: |
            echo "=== TUWI BACKEND DEPLOY ==="
            echo "Step 1: Setup"
            cd /opt/tuwi-backend || mkdir -p /opt/tuwi-backend && cd /opt/tuwi-backend

            echo "Step 2: Backup .env"
            test -f .env && cp .env /tmp/.env.backup

            echo "Step 3: Git setup"
            if [ ! -d ".git" ]; then
              echo "Initializing new git repo..."
              git init
            fi

            echo "Configuring remote..."
            git remote remove origin 2>/dev/null || true
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/znattechnology/Pro-Ingles-server.git"
            echo "Remote configured"

            echo "Step 4: Git pull"
            git fetch origin
            git reset --hard origin/main

            echo "Step 5: Restore .env"
            test -f /tmp/.env.backup && cp /tmp/.env.backup .env && rm /tmp/.env.backup

            echo "Step 6: SSL setup"
            mkdir -p nginx/ssl nginx/certbot/conf nginx/certbot/www
            # Create temporary self-signed cert if none exists (needed for nginx to start)
            if [ ! -f "nginx/ssl/fullchain.pem" ]; then
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout nginx/ssl/privkey.pem -out nginx/ssl/fullchain.pem -subj "/CN=proenglish.cloud/O=ProEnglish/C=PT"
            fi

            echo "Step 7: Check .env"
            test -f .env || { echo "ERROR: .env not found"; exit 1; }

            echo "Step 8: Stop conflicting services"
            systemctl stop nginx 2>/dev/null || true
            systemctl stop apache2 2>/dev/null || true
            systemctl stop httpd 2>/dev/null || true
            systemctl disable nginx 2>/dev/null || true
            systemctl disable apache2 2>/dev/null || true
            systemctl disable httpd 2>/dev/null || true
            sleep 2
            echo "Services stopped"

            echo "Step 9: Docker"
            docker compose -f docker-compose.prod.yml down --remove-orphans || true
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d

            echo "Step 10: Wait for containers"
            sleep 10
            echo "Waiting for backend to be healthy..."
            for i in 1 2 3 4 5 6; do
              if docker compose -f docker-compose.prod.yml exec -T backend echo "OK" 2>/dev/null; then
                echo "Backend container is ready"
                break
              fi
              echo "Waiting... attempt $i"
              sleep 10
            done

            echo "Step 11: Migrations"
            docker compose -f docker-compose.prod.yml exec -T backend python manage.py migrate --noinput || echo "Migration warning"
            docker compose -f docker-compose.prod.yml exec -T backend python manage.py collectstatic --noinput || echo "Collectstatic warning"

            echo "Step 12: Status"
            docker compose -f docker-compose.prod.yml ps
            echo "=== BACKEND LOGS ==="
            docker compose -f docker-compose.prod.yml logs --tail=100 backend 2>&1 || true
            echo "=== END BACKEND LOGS ==="

            echo "Step 13: Health check"
            curl -sf http://localhost:8000/api/health/ && echo "Backend OK" || echo "Backend check failed"

            echo "Step 14: Let's Encrypt SSL"
            # Check if we already have a valid Let's Encrypt certificate
            if [ -f "/etc/letsencrypt/live/proenglish.cloud/fullchain.pem" ]; then
              echo "Let's Encrypt certificate exists, copying..."
              cp /etc/letsencrypt/live/proenglish.cloud/fullchain.pem nginx/ssl/fullchain.pem
              cp /etc/letsencrypt/live/proenglish.cloud/privkey.pem nginx/ssl/privkey.pem
              docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload || true
            else
              echo "Obtaining new Let's Encrypt certificate..."

              # Install certbot if not present
              if ! command -v certbot &> /dev/null; then
                echo "Installing certbot..."
                apt-get update
                apt-get install -y certbot
              fi

              # Stop nginx container to free port 80
              echo "Stopping nginx to free port 80..."
              docker compose -f docker-compose.prod.yml stop nginx || true
              sleep 3

              # Kill any process using port 80
              fuser -k 80/tcp 2>/dev/null || true
              sleep 2

              # Get certificate using standalone mode
              echo "Running certbot..."
              certbot certonly --standalone --non-interactive --agree-tos \
                --email admin@proenglish.cloud \
                -d proenglish.cloud -d api.proenglish.cloud \
                --preferred-challenges http \
                || echo "Certbot warning - may need manual setup"

              # Copy certificates if obtained
              if [ -f "/etc/letsencrypt/live/proenglish.cloud/fullchain.pem" ]; then
                cp /etc/letsencrypt/live/proenglish.cloud/fullchain.pem nginx/ssl/fullchain.pem
                cp /etc/letsencrypt/live/proenglish.cloud/privkey.pem nginx/ssl/privkey.pem
                echo "SSL certificates installed successfully"
              else
                echo "WARNING: Let's Encrypt certificate not obtained. Using self-signed certificate."
              fi

              # Restart nginx
              echo "Starting nginx..."
              docker compose -f docker-compose.prod.yml start nginx || true
            fi

            echo "Step 15: Final health check"
            sleep 5
            curl -sf http://localhost:8000/api/health/ && echo "Backend OK" || echo "Backend check failed"
            curl -sk https://proenglish.cloud/api/health/ && echo "HTTPS OK" || echo "HTTPS check - may need DNS propagation"

            echo "=== DEPLOY COMPLETE ==="