name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild containers'
        required: false
        default: false
        type: boolean

env:
  VPS_HOST: 72.61.190.180
  VPS_USER: root
  PROJECT_PATH: /opt/tuwi-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: GH_TOKEN
          script_stop: true
          timeout: 300s
          command_timeout: 30m
          debug: true
          script: |
            echo "=== TUWI BACKEND DEPLOY ==="
            echo "Step 1: Setup"
            cd /opt/tuwi-backend || mkdir -p /opt/tuwi-backend && cd /opt/tuwi-backend

            echo "Step 2: Backup .env"
            test -f .env && cp .env /tmp/.env.backup

            echo "Step 3: Git setup"
            if [ ! -d ".git" ]; then
              git init
              git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/znattechnology/Pro-Ingles-server.git"
            else
              git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/znattechnology/Pro-Ingles-server.git"
            fi

            echo "Step 4: Git pull"
            git fetch origin
            git reset --hard origin/main

            echo "Step 5: Restore .env"
            test -f /tmp/.env.backup && cp /tmp/.env.backup .env && rm /tmp/.env.backup

            echo "Step 6: SSL setup"
            if [ ! -f "nginx/ssl/fullchain.pem" ]; then
              mkdir -p nginx/ssl
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout nginx/ssl/privkey.pem -out nginx/ssl/fullchain.pem -subj "/CN=72.61.190.180/O=TuwiBackend/C=PT"
            fi
            mkdir -p nginx/certbot/conf nginx/certbot/www

            echo "Step 7: Check .env"
            test -f .env || { echo "ERROR: .env not found"; exit 1; }

            echo "Step 8: Docker"
            docker compose -f docker-compose.prod.yml down --remove-orphans || true
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d

            echo "Step 9: Wait for startup"
            sleep 20

            echo "Step 10: Migrations"
            docker compose -f docker-compose.prod.yml exec -T backend python manage.py migrate --noinput
            docker compose -f docker-compose.prod.yml exec -T backend python manage.py collectstatic --noinput

            echo "Step 11: Status"
            docker compose -f docker-compose.prod.yml ps
            curl -sf http://localhost:8000/api/health/ && echo "Backend OK" || echo "Backend check failed"

            echo "=== DEPLOY COMPLETE ==="