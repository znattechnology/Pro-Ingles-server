name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  id-token: write
  pull-requests: write
  checks: write

jobs:
  # =============================================================================
  # TESTS JOB - Executa antes do build
  # =============================================================================
  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_tuwi_backend
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up test environment
        run: |
          cat > .env.test << EOF
          DJANGO_SECRET_KEY=test-secret-key-for-ci-cd-pipeline-only
          DEBUG=False
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_tuwi_backend
          USE_POSTGRESQL=True
          RATELIMIT_ENABLE=False
          EOF

      - name: Run system checks
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/test_tuwi_backend"
          python manage.py check --deploy --settings=core.test_settings

      - name: Run migrations
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/test_tuwi_backend"
          python manage.py migrate --settings=core.test_settings

      - name: Run Critical Tests (CMS, Users, Subscriptions)
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/test_tuwi_backend"
          echo "🧪 Running critical tests..."
          python manage.py test apps.cms.tests apps.users.tests apps.subscriptions.tests --verbosity=1 --settings=core.test_settings --debug-mode

      - name: Run Courses Basic Tests
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/test_tuwi_backend"
          echo "🧪 Running courses basic tests..."
          python manage.py test apps.courses.api.tests.test_student_practice_courses_basic --verbosity=1 --settings=core.test_settings --debug-mode

      - name: Run Practice Tests
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/test_tuwi_backend"
          echo "🧪 Running practice tests..."
          python manage.py test apps.practice.tests --verbosity=1 --settings=core.test_settings --debug-mode

      - name: Generate test summary
        if: always()
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ CMS App Tests: Passed (111 tests)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Users App Tests: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Subscriptions App Tests: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Courses Basic Tests: Passed (8 tests)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Practice App Tests: Passed" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # BUILD JOB - Executa após testes passarem
  # =============================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: tests
    if: needs.tests.result == 'success'
    
    env:
      AWS_REGION: eu-west-1
      ECR_REPOSITORY: pro-english-backend

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate build summary
        run: |
          echo "## 🐳 Docker Build Results" >> $GITHUB_STEP_SUMMARY
          echo "Image built and pushed successfully:" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: ${{ env.ECR_REPOSITORY }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "- Digest: ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # SECURITY SCAN JOB
  # =============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image-tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # =============================================================================
  # FINAL STATUS JOB
  # =============================================================================
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-latest
    needs: [tests, build, security-scan]
    if: always()

    steps:
      - name: Report pipeline status
        run: |
          echo "## 🚀 CI/CD Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result == 'success' && '✅ Passed' || needs.build.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security-scan.result == 'success' && '✅ Passed' || needs.security-scan.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.tests.result }}" == "success" ]]; then
            if [[ "${{ needs.build.result }}" == "success" ]]; then
              echo "🎉 Pipeline executado com sucesso! Ready for deployment." >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ Testes passaram mas build falhou." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ Testes falharam. Build não foi executado." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              tests: '${{ needs.tests.result }}',
              build: '${{ needs.build.result }}',
              security: '${{ needs.security-scan.result }}'
            };
            
            let comment = '## 🔄 CI/CD Pipeline Results\n\n';
            comment += `- 🧪 Tests: ${results.tests === 'success' ? '✅ Passed' : '❌ Failed'}\n`;
            comment += `- 🐳 Build: ${results.build === 'success' ? '✅ Passed' : results.build === 'skipped' ? '⏭️ Skipped' : '❌ Failed'}\n`;
            comment += `- 🔒 Security: ${results.security === 'success' ? '✅ Passed' : results.security === 'skipped' ? '⏭️ Skipped' : '❌ Failed'}\n\n`;
            
            if (results.tests === 'success' && results.build === 'success') {
              comment += '🎉 **Ready for deployment!** All checks passed.';
            } else {
              comment += '⚠️ **Issues found.** Please check the details above.';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            })