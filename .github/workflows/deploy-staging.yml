name: Deploy to Staging

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  # =============================================================================
  # BUILD JOB - DOCKER IMAGE (reutiliza do workflow principal)
  # =============================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsPushRole
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com/tuwi-backend
          tags: |
            type=ref,event=branch,prefix=staging-
            type=ref,event=pr,prefix=pr-
            type=sha,prefix=staging-{{branch}}-

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  # =============================================================================
  # SECURITY SCAN JOB
  # =============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsPushRole
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image-tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # =============================================================================
  # DEPLOY TO STAGING JOB
  # =============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging-api.tuwi.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsDeployRole
          aws-region: eu-west-1

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name tuwi-eks --region eu-west-1

      - name: Create staging namespace (if not exists)
        run: |
          kubectl apply -f k8s/staging/namespace.yaml

      - name: Deploy staging secrets
        run: |
          # Substituir placeholders nos secrets
          sed -e "s|__DJANGO_SECRET_KEY_PLACEHOLDER__|${{ secrets.DJANGO_SECRET_KEY_STAGING }}|g" \
              -e "s|postgresql://neondb_owner:password@ep-divine-dew-agc1ldk8-pooler.c-2.eu-central-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require|${{ secrets.DATABASE_URL_STAGING }}|g" \
              k8s/secrets.yaml > k8s/staging/secrets-staging.yaml
          
          # Aplicar secrets no namespace staging
          kubectl apply -f k8s/staging/secrets-staging.yaml -n staging

      - name: Deploy service account and RBAC
        run: |
          # Substituir placeholders
          sed -e "s|<AWS_ACCOUNT_ID>|${{ secrets.AWS_ACCOUNT_ID }}|g" \
              k8s/service-account.yaml > k8s/staging/service-account-staging.yaml
          
          kubectl apply -f k8s/staging/service-account-staging.yaml -n staging

      - name: Run database migrations
        run: |
          # Substituir placeholders no job de migração
          export IMAGE_TAG="${{ needs.build.outputs.image-tag }}"
          export AWS_ACCOUNT_ID="${{ secrets.AWS_ACCOUNT_ID }}"
          export AWS_REGION="eu-west-1"
          
          # Preparar manifest de migração
          envsubst < k8s/migrate-job.yaml > k8s/staging/migrate-job-staging.yaml
          
          # Executar migração
          kubectl apply -f k8s/staging/migrate-job-staging.yaml -n staging
          
          # Aguardar conclusão
          kubectl wait --for=condition=complete job/django-migrate -n staging --timeout=300s

      - name: Deploy application
        run: |
          # Substituir placeholders no deployment
          export IMAGE_TAG="${{ needs.build.outputs.image-tag }}"
          export AWS_ACCOUNT_ID="${{ secrets.AWS_ACCOUNT_ID }}"
          export AWS_REGION="eu-west-1"
          
          envsubst < k8s/staging/deployment.yaml | kubectl apply -f - -n staging
          
          # Aguardar rollout
          kubectl rollout status deployment/django-staging -n staging --timeout=300s

      - name: Deploy ingress
        run: |
          kubectl apply -f k8s/staging/ingress.yaml -n staging

      - name: Verify deployment
        run: |
          echo "🔍 Verificando deployment..."
          
          # Status dos pods
          kubectl get pods -n staging -l app=django
          
          # Status do service
          kubectl get svc -n staging -l app=django
          
          # Status do ingress
          kubectl get ingress -n staging
          
          # Logs recentes
          kubectl logs -n staging -l app=django --tail=10

      - name: Run smoke tests
        run: |
          echo "🧪 Executando smoke tests..."
          
          # Aguardar alguns segundos para estabilizar
          sleep 30
          
          # Obter URL do load balancer
          INGRESS_URL=$(kubectl get ingress django-ingress-staging -n staging -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          
          if [ ! -z "$INGRESS_URL" ]; then
            echo "🌐 Testando endpoint: http://$INGRESS_URL/api/health/"
            
            # Teste básico de conectividade
            for i in {1..5}; do
              if curl -f -s "http://$INGRESS_URL/api/health/" > /dev/null; then
                echo "✅ Health check passou (tentativa $i)"
                break
              else
                echo "❌ Health check falhou (tentativa $i)"
                if [ $i -eq 5 ]; then
                  echo "💥 Todos os health checks falharam"
                  exit 1
                fi
                sleep 10
              fi
            done
          else
            echo "⚠️ Ingress URL não disponível ainda"
          fi

      - name: Cleanup old resources
        run: |
          echo "🧹 Limpando recursos antigos..."
          
          # Remover jobs de migração antigos (manter apenas os 3 mais recentes)
          kubectl get jobs -n staging --sort-by=.metadata.creationTimestamp -o name | head -n -3 | xargs -r kubectl delete -n staging

      - name: Notify deployment success
        if: success()
        run: |
          echo "🎉 Deployment para staging concluído com sucesso!"
          echo "🔗 URL: https://staging-api.tuwi.com"
          echo "📊 Dashboard: kubectl -n staging get all"

  # =============================================================================
  # INTEGRATION TESTS JOB
  # =============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          pip install pytest requests python-dotenv

      - name: Run integration tests
        env:
          STAGING_URL: https://staging-api.tuwi.com
          API_KEY: ${{ secrets.STAGING_API_KEY }}
        run: |
          echo "🧪 Executando testes de integração..."
          # Adicionar seus testes de integração aqui
          # pytest tests/integration/ --base-url=$STAGING_URL